<html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registro de Familias</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #f5f2eb;
      --panel: #ffffff;
      --border: #d4cfc4;
      --accent: #2d6a4f;
      --accent-light: #e8f5ee;
      --text: #1a1a1a;
      --muted: #7a7568;
      --danger: #c0392b;
      --danger-light: #fdecea;
      --mono: 'IBM Plex Mono', monospace;
      --sans: 'IBM Plex Sans', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      font-family: var(--sans);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    header {
      max-width: 960px;
      margin: 0 auto 2rem;
      border-bottom: 2px solid var(--text);
      padding-bottom: 1rem;
      display: flex;
      align-items: baseline;
      gap: 1rem;
    }

    header h1 {
      font-family: var(--mono);
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    header span {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 2px 8px;
      border-radius: 2px;
    }

    .layout {
      max-width: 960px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 1.5rem;
    }

    @media (max-width: 720px) {
      .layout { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1.5rem;
    }

    .card h2 {
      font-family: var(--mono);
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 1.25rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
    }

    .field { margin-bottom: 1rem; }

    label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 0.35rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input, select {
      width: 100%;
      padding: 0.6rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 3px;
      background: var(--bg);
      font-family: var(--sans);
      font-size: 0.9rem;
      color: var(--text);
      transition: border-color 0.15s, box-shadow 0.15s;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(45, 106, 79, 0.12);
      background: #fff;
    }

    input[type="number"] { font-family: var(--mono); }

    .btn {
      width: 100%;
      padding: 0.7rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 3px;
      font-family: var(--mono);
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: background 0.15s, transform 0.1s;
    }

    .btn:hover { background: #235c42; }
    .btn:active { transform: scale(0.99); }

    .btn-clear {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      margin-top: 0.4rem;
    }
    .btn-clear:hover { background: var(--bg); color: var(--text); }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      background: var(--accent);
      color: #fff;
      padding: 0.7rem 1.2rem;
      border-radius: 4px;
      font-family: var(--mono);
      font-size: 0.8rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      z-index: 100;
    }
    #toast.show { opacity: 1; }

    /* Table area */
    .table-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
      gap: 0.5rem;
    }

    .search-box {
      flex: 1;
      max-width: 240px;
      padding: 0.45rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 3px;
      font-family: var(--sans);
      font-size: 0.85rem;
      background: var(--bg);
      outline: none;
    }
    .search-box:focus { border-color: var(--accent); }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .stat-box {
      background: var(--accent-light);
      border: 1px solid #b7dac7;
      border-radius: 3px;
      padding: 0.75rem;
      text-align: center;
    }

    .stat-box .val {
      font-family: var(--mono);
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--accent);
    }

    .stat-box .lbl {
      font-size: 0.7rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-top: 2px;
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 3px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
    }

    thead tr {
      background: var(--text);
      color: #fff;
    }

    thead th {
      padding: 0.6rem 0.75rem;
      text-align: left;
      font-family: var(--mono);
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }

    thead th:hover { background: #333; }

    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.1s;
    }

    tbody tr:hover { background: #faf8f4; }
    tbody tr:last-child { border-bottom: none; }

    tbody td {
      padding: 0.6rem 0.75rem;
      vertical-align: middle;
    }

    td.monto {
      font-family: var(--mono);
      font-weight: 600;
      color: var(--accent);
    }

    td.fecha { font-family: var(--mono); font-size: 0.8rem; color: var(--muted); }

    .btn-del {
      background: none;
      border: 1px solid #e0b0ab;
      color: var(--danger);
      font-family: var(--mono);
      font-size: 0.7rem;
      padding: 3px 8px;
      border-radius: 2px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-del:hover { background: var(--danger-light); }

    .empty {
      text-align: center;
      padding: 2.5rem;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.82rem;
    }

    .badge {
      display: inline-block;
      background: var(--accent-light);
      color: var(--accent);
      font-family: var(--mono);
      font-size: 0.68rem;
      padding: 2px 7px;
      border-radius: 10px;
      border: 1px solid #b7dac7;
    }

    /* API status bar */
    .api-bar {
      max-width: 960px;
      margin: 0 auto 1rem;
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #e67e22;
    }
    .dot.online { background: var(--accent); }

    #api-status-text { }
  </style>
</head>
<body>

<header>
  <h1>Registro de Familias</h1>
  <span>v1.0</span>
</header>

<div class="api-bar">
  <div class="dot" id="api-dot"></div>
  <span id="api-status-text">servidor activo</span>
</div>

<div class="layout">

  <!-- FORM -->
  <div class="card">
    <h2>Nuevo Registro</h2>

    <div class="field">
      <label>Nombre de la Familia</label>
      <input type="text" id="inp-familia" placeholder="Ej: Familia García" autocomplete="off"/>
    </div>

    <div class="field">
      <label>Monto ($)</label>
      <input type="number" id="inp-monto" placeholder="0.00" min="0" step="0.01"/>
    </div>

    <div class="field">
      <label>Fecha del Registro</label>
      <input type="date" id="inp-fecha"/>
    </div>

    <div class="field">
      <label>Descripción (opcional)</label>
      <input type="text" id="inp-desc" placeholder="Nota o concepto..."/>
    </div>

    <button class="btn" onclick="guardar()">Guardar Registro</button>
    <button class="btn btn-clear" onclick="limpiarForm()">Limpiar</button>
  </div>

  <!-- TABLE -->
  <div class="card">
    <h2>Registros</h2>

    <div class="stats">
      <div class="stat-box">
        <div class="val" id="stat-total">0</div>
        <div class="lbl">Registros</div>
      </div>
      <div class="stat-box">
        <div class="val" id="stat-familias">0</div>
        <div class="lbl">Familias</div>
      </div>
      <div class="stat-box">
        <div class="val" id="stat-monto">$0</div>
        <div class="lbl">Total</div>
      </div>
    </div>

    <div class="table-header">
      <input class="search-box" type="text" id="buscar" placeholder="Buscar familia..." oninput="renderTabla()"/>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th onclick="sortBy('familia')">Familia ↕</th>
            <th onclick="sortBy('monto')">Monto ↕</th>
            <th onclick="sortBy('fecha')">Fecha ↕</th>
            <th>Nota</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tabla-body"></tbody>
      </table>
    </div>
  </div>

</div>

<div id="toast"></div>

<script>
  // ──────────────────────────────────────────
  // CONFIGURACIÓN — cambia esta URL a la de tu backend
  // ──────────────────────────────────────────
  const API = 'http://localhost:3000/api';

  let registros = [];
  let sortCol = 'fecha';
  let sortAsc = false;

  // Fecha de hoy por defecto
  document.getElementById('inp-fecha').valueAsDate = new Date();

  // ──────────────────────────────────────────
  // Verificar conexión con backend
  // ──────────────────────────────────────────
  async function checkAPI() {
    try {
      const r = await fetch(`${API}/ping`, { signal: AbortSignal.timeout(3000) });
      if (r.ok) {
        document.getElementById('api-dot').classList.add('online');
        document.getElementById('api-status-text').textContent = 'Conectado al servidor MySQL';
        cargar();
      } else { throw new Error(); }
    } catch {
      document.getElementById('api-status-text').textContent =
        'Servidor no disponible — datos guardados localmente (localStorage)';
      cargarLocal();
    }
  }

  // ──────────────────────────────────────────
  // GUARDAR
  // ──────────────────────────────────────────
  async function guardar() {
    const familia = document.getElementById('inp-familia').value.trim();
    const monto   = parseFloat(document.getElementById('inp-monto').value);
    const fecha   = document.getElementById('inp-fecha').value;
    const desc    = document.getElementById('inp-desc').value.trim();

    if (!familia) return toast('Ingresa el nombre de la familia');
    if (isNaN(monto) || monto < 0) return toast('Ingresa un monto válido');
    if (!fecha) return toast('Selecciona una fecha');

    const reg = { familia, monto, fecha, descripcion: desc };

    try {
      const r = await fetch(`${API}/registros`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(reg),
        signal: AbortSignal.timeout(4000)
      });
      const data = await r.json();
      reg.id = data.id;
      registros.unshift(reg);
      toast('Registro guardado en MySQL ✓');
    } catch {
      // Fallback local
      reg.id = Date.now();
      registros.unshift(reg);
      guardarLocal();
      toast('Guardado localmente (sin servidor)');
    }

    limpiarForm();
    renderTabla();
  }

  // ──────────────────────────────────────────
  // CARGAR desde backend
  // ──────────────────────────────────────────
  async function cargar() {
    try {
      const r = await fetch(`${API}/registros`);
      registros = await r.json();
      renderTabla();
    } catch { cargarLocal(); }
  }

  // ──────────────────────────────────────────
  // ELIMINAR
  // ──────────────────────────────────────────
  async function eliminar(id) {
    if (!confirm('¿Eliminar este registro?')) return;
    try {
      await fetch(`${API}/registros/${id}`, { method: 'DELETE' });
    } catch {}
    registros = registros.filter(r => r.id !== id);
    guardarLocal();
    renderTabla();
    toast('Registro eliminado');
  }

  // ──────────────────────────────────────────
  // LOCAL STORAGE (fallback)
  // ──────────────────────────────────────────
  function guardarLocal() {
    localStorage.setItem('registros_familias', JSON.stringify(registros));
  }
  function cargarLocal() {
    const d = localStorage.getItem('registros_familias');
    registros = d ? JSON.parse(d) : [];
    renderTabla();
  }

  // ──────────────────────────────────────────
  // RENDER TABLA
  // ──────────────────────────────────────────
  function renderTabla() {
    const q = document.getElementById('buscar').value.toLowerCase();
    let data = registros.filter(r => r.familia.toLowerCase().includes(q));

    data.sort((a, b) => {
      let va = a[sortCol], vb = b[sortCol];
      if (sortCol === 'monto') { va = parseFloat(va); vb = parseFloat(vb); }
      if (va < vb) return sortAsc ? -1 : 1;
      if (va > vb) return sortAsc ? 1 : -1;
      return 0;
    });

    const tbody = document.getElementById('tabla-body');
    if (data.length === 0) {
      tbody.innerHTML = `<tr><td colspan="5" class="empty">Sin registros aún</td></tr>`;
    } else {
      tbody.innerHTML = data.map(r => `
        <tr>
          <td><strong>${esc(r.familia)}</strong></td>
          <td class="monto">${formatMonto(r.monto)}</td>
          <td class="fecha">${formatFecha(r.fecha)}</td>
          <td>${r.descripcion ? `<span class="badge">${esc(r.descripcion)}</span>` : '<span style="color:var(--border)">—</span>'}</td>
          <td><button class="btn-del" onclick="eliminar(${r.id})">✕</button></td>
        </tr>
      `).join('');
    }

    // Stats
    document.getElementById('stat-total').textContent = registros.length;
    const familias = new Set(registros.map(r => r.familia.toLowerCase())).size;
    document.getElementById('stat-familias').textContent = familias;
    const total = registros.reduce((s, r) => s + parseFloat(r.monto || 0), 0);
    document.getElementById('stat-monto').textContent = formatMonto(total);
  }

  function sortBy(col) {
    if (sortCol === col) sortAsc = !sortAsc;
    else { sortCol = col; sortAsc = true; }
    renderTabla();
  }

  // ──────────────────────────────────────────
  // UTILIDADES
  // ──────────────────────────────────────────
  function limpiarForm() {
    document.getElementById('inp-familia').value = '';
    document.getElementById('inp-monto').value = '';
    document.getElementById('inp-desc').value = '';
    document.getElementById('inp-fecha').valueAsDate = new Date();
    document.getElementById('inp-familia').focus();
  }

  function formatMonto(v) {
    return '$' + parseFloat(v).toLocaleString('es-CO', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function formatFecha(f) {
    if (!f) return '—';
    const [y, m, d] = f.split('T')[0].split('-');
    return `${d}/${m}/${y}`;
  }

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  let toastTimer;
  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
  }

  // Enter para guardar
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && ['inp-familia','inp-monto','inp-fecha','inp-desc'].includes(e.target.id)) {
      guardar();
    }
  });

  // Iniciar
  checkAPI();
</script>
</body>
</html>
